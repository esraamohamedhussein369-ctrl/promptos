services:
  - type: web
    name: promptos
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: promptos-data
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: .data/promptos.sqlite
      - key: TRUST_PROXY
        value: "true"
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: SESSION_SECRET
        generateValue: true
      - key: SIGNUP_INVITE_CODE
        sync: false
      - key: ADMIN_SETUP_CODE
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
